# Projeto isolado — URL: http://localhost:3020
name: mesclar-logistica

services:
  db:
    image: postgres:16-alpine
    container_name: mesclar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesclar
      POSTGRES_PASSWORD: mesclar_secret
      POSTGRES_DB: mesclar_logistica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesclar -d mesclar_logistica"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5439:5432"
    volumes:
      - mesclar_pg_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: ["sh", "./scripts/docker-entrypoint.sh"]
    container_name: mesclar-web
    restart: unless-stopped
    ports:
      - "3020:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://mesclar:mesclar_secret@db:5432/mesclar_logistica?schema=public
      AUTH_SECRET: mesclar-dev-auth-secret-minimo-32-caracteres
      NEXTAUTH_URL: http://localhost:3020
      WATCHPACK_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - mesclar_node_modules:/app/node_modules
      - ./uploads:/app/uploads

volumes:
  mesclar_pg_data:
  mesclar_node_modules:
