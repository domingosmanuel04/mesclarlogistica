# Production stack for a VPS (Docker + Nginx, blue/green).
# Deploy with: bash scripts/deploy-docker.sh
# Requires a .env with POSTGRES_PASSWORD, AUTH_SECRET, NEXTAUTH_URL.
name: mesclar-prod

x-web: &web
  build:
    context: .
    dockerfile: Dockerfile
    target: runner
  image: mesclar-web:latest
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: postgresql://mesclar:${POSTGRES_PASSWORD}@db:5432/mesclar_logistica?schema=public
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 90s
  stop_grace_period: 30s
  volumes:
    - uploads:/app/uploads
  deploy:
    resources:
      limits:
        memory: 1500M
    restart_policy:            # honoured by Swarm; compose uses `restart:` above
      condition: on-failure
      delay: 5s
      max_attempts: 10
      window: 120s
    update_config:             # Swarm rolling update: new task healthy before old stops
      order: start-first
      failure_action: rollback
      monitor: 60s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesclar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mesclar_logistica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesclar -d mesclar_logistica"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pg_data:/var/lib/postgresql/data

  web_blue:
    <<: *web

  web_green:
    <<: *web
    profiles: ["green"]        # started only during blue/green switch

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/upstream.conf:/etc/nginx/upstream.conf:ro
    depends_on:
      web_blue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pg_data:
  uploads:
