name: Deploy Automático AngOWeb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy em Produção
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy no Servidor AngOWeb
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || 'mesclarlogistica.com' }}
          username: ${{ secrets.SSH_USERNAME || 'mesclarl' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            if [ -d "/mnt/home103/mesclarl/mesclar" ]; then
              cd /mnt/home103/mesclarl/mesclar
            elif [ -d "$HOME/mesclar" ]; then
              cd "$HOME/mesclar"
            elif [ -d "$HOME/public_html/mesclar" ]; then
              cd "$HOME/public_html/mesclar"
            elif [ -d "$HOME/public_html" ]; then
              cd "$HOME/public_html"
            fi
            echo "=== Diretório de Implantação: $(pwd) ==="
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
