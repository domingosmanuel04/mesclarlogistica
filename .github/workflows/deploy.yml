name: Deploy Automático AngOWeb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy em Produção
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy via SSH no Servidor AngOWeb
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          HOST="${SSH_HOST:-mesclarlogistica.com}"
          USER="${SSH_USER:-mesclarl}"
          PORT="${SSH_PORT:-22}"

          echo "=== Parâmetros de Ligação SSH ==="
          echo "Host: $HOST"
          echo "User: $USER"
          echo "Port: $PORT"
          if [ -n "$SSH_KEY" ]; then echo "Chave SSH: Presente"; else echo "Chave SSH: Ausente"; fi
          if [ -n "$SSH_PASS" ]; then echo "Palavra-passe SSH: Presente"; else echo "Palavra-passe SSH: Ausente"; fi

          sudo apt-get update -qq && sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          CMD='if [ -d "/mnt/home103/mesclarl/mesclar" ]; then cd /mnt/home103/mesclarl/mesclar; elif [ -d "$HOME/mesclar" ]; then cd "$HOME/mesclar"; elif [ -d "$HOME/public_html/mesclar" ]; then cd "$HOME/public_html/mesclar"; elif [ -d "$HOME/public_html" ]; then cd "$HOME/public_html"; fi; echo "=== Diretório: $(pwd) ==="; git fetch origin main; git reset --hard origin/main; bash scripts/deploy.sh'

          DEPLOYED=false

          if [ -n "$SSH_KEY" ]; then
            echo "=== Tentando Autenticação via Chave SSH ==="
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            if ssh -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_rsa $USER@$HOST "$CMD"; then
              DEPLOYED=true
            else
              echo "⚠️ Autenticação por chave SSH falhou. Tentando palavra-passe como alternativa..."
            fi
          fi

          if [ "$DEPLOYED" = "false" ] && [ -n "$SSH_PASS" ]; then
            echo "=== Tentando Autenticação via Palavra-passe SSH ==="
            if sshpass -p "$SSH_PASS" ssh -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no $USER@$HOST "$CMD"; then
              DEPLOYED=true
            else
              echo "⚠️ Autenticação por palavra-passe SSH falhou."
            fi
          fi

          if [ "$DEPLOYED" = "false" ]; then
            echo "::error::Não foi possível autenticar no servidor de produção via SSH!"
            echo "Verifique se os segredos SSH_HOST, SSH_USERNAME e SSH_PASSWORD (ou SSH_KEY) estão corretos em Settings > Secrets and variables > Actions no GitHub."
            exit 1
          fi
