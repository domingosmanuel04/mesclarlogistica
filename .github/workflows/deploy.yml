name: Deploy Automático AngOWeb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy em Produção
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy no Servidor AngOWeb
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || 'mesclarlogistica.com' }}
          username: ${{ secrets.SSH_USERNAME || 'mesclarl' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /mnt/home103/mesclarl/mesclar || cd $HOME/mesclar
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
