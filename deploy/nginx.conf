# Mesclar Logística - reverse proxy with retry/failover (blue/green)
# Active/backup servers live in upstream.conf (rewritten by scripts/deploy-docker.sh)
include /etc/nginx/upstream.conf;

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://mesclar_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Retry on another upstream instead of showing an error during restarts
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Only if every upstream failed: friendly page with auto-refresh
    error_page 502 503 504 = @restarting;
    location @restarting {
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="5"><title>Mesclar Logística</title><body style="font-family:sans-serif;background:#071324;color:#f8fafc;text-align:center;padding-top:20vh"><h1>Servidor em Inicialização</h1><p>Esta página será recarregada automaticamente.</p></body>';
    }
}
